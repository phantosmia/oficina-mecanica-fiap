name: Publish API image to ECR

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - docker-entrypoint.sh
      - pyproject.toml
      - poetry.lock
      - app/**
      - scripts/**
      - .github/workflows/publish-ecr.yml

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'oficina-mecanica-fiap' }}

jobs:
  publish:
    name: Build and push Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login no Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Definir tags da imagem
        id: image
        run: |
          IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}"
          echo "uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${IMAGE_URI}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "latest_tag=${IMAGE_URI}:latest" >> "$GITHUB_OUTPUT"

      - name: Build da imagem Docker
        run: |
          docker build \
            -t "${{ steps.image.outputs.sha_tag }}" \
            -t "${{ steps.image.outputs.latest_tag }}" \
            .

      - name: Publicar imagem no ECR
        run: |
          docker push "${{ steps.image.outputs.sha_tag }}"
          docker push "${{ steps.image.outputs.latest_tag }}"

      - name: Resumo
        run: |
          echo "Imagem publicada: ${{ steps.image.outputs.sha_tag }}"
          echo "Imagem latest: ${{ steps.image.outputs.latest_tag }}"
