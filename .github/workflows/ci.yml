name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Testes automatizados
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar Poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.2.1
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Restaurar cache do ambiente virtual
        uses: actions/cache@v4
        with:
          path: |
            .venv
            ~/.cache/pypoetry
          key: ${{ runner.os }}-python-3.12-poetry-${{ hashFiles('pyproject.toml', 'poetry.lock', 'poetry.toml') }}
          restore-keys: |
            ${{ runner.os }}-python-3.12-poetry-

      - name: Instalar dependências
        run: poetry install --with dev

      - name: Executar testes com cobertura
        # O Testcontainers provisiona um PostgreSQL efêmero (postgres:16-alpine)
        # automaticamente no início da sessão de testes e o destrói ao final.
        # O Docker já está disponível no runner ubuntu-latest, dispensando um
        # passo dedicado para subir o banco.
        run: poetry run python -m pytest

  build:
    name: Build da aplicação
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Construir imagem Docker
        run: docker build -t oficina-mecanica-fiap:ci .