name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Testes automatizados
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: oficina
      POSTGRES_PASSWORD: oficina
      POSTGRES_DB: oficina_test
      DATABASE_URL: postgresql+psycopg://oficina:oficina@localhost:5432/oficina_test

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Subir PostgreSQL (passo dedicado)
        run: |
          docker run -d \
            --name oficina-ci-postgres \
            -e POSTGRES_USER=$POSTGRES_USER \
            -e POSTGRES_PASSWORD=$POSTGRES_PASSWORD \
            -e POSTGRES_DB=$POSTGRES_DB \
            -p 5432:5432 \
            --health-cmd "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB" \
            --health-interval 5s \
            --health-timeout 3s \
            --health-retries 10 \
            postgres:16-alpine

      - name: Aguardar PostgreSQL ficar saudável
        run: |
          for i in {1..30}; do
            status=$(docker inspect --format='{{.State.Health.Status}}' oficina-ci-postgres 2>/dev/null || echo "starting")
            echo "Tentativa $i — status: $status"
            if [ "$status" = "healthy" ]; then
              echo "PostgreSQL pronto."
              exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL não ficou saudável a tempo." >&2
          docker logs oficina-ci-postgres || true
          exit 1

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar Poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.2.1
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Restaurar cache do ambiente virtual
        uses: actions/cache@v4
        with:
          path: |
            .venv
            ~/.cache/pypoetry
          key: ${{ runner.os }}-python-3.12-poetry-${{ hashFiles('pyproject.toml', 'poetry.lock', 'poetry.toml') }}
          restore-keys: |
            ${{ runner.os }}-python-3.12-poetry-

      - name: Instalar dependências
        run: poetry install --with dev

      - name: Executar testes com cobertura
        run: poetry run python -m pytest

      - name: Encerrar PostgreSQL
        if: always()
        run: docker rm -f oficina-ci-postgres || true

  build:
    name: Build da aplicação
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Construir imagem Docker
        run: docker build -t oficina-mecanica-fiap:ci .