name: Deploy AWS/EKS

on:
  workflow_dispatch:
    inputs:
      deployment_mode:
        description: "Modo de deploy"
        type: choice
        options:
          - aws
          - aws-academy
        default: aws-academy
      terraform_apply:
        description: "Executar terraform apply antes do deploy?"
        type: boolean
        default: false
      build_image:
        description: "Buildar e publicar imagem no ECR antes do deploy?"
        type: boolean
        default: true
      image_tag:
        description: "Tag da imagem ECR a implantar"
        type: string
        default: latest
      public_base_url:
        description: "URL pública da API usada nos e-mails. No aws-academy, vazio usa o LoadBalancer criado."
        type: string
        default: ""
      wait_timeout:
        description: "Timeout para Job/rollout Kubernetes"
        type: string
        default: 10m

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-aws-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_BACKEND_CONFIG: ${{ secrets.TF_BACKEND_CONFIG }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_STATE_KEY: ${{ vars.TF_STATE_KEY || 'aws/dev/terraform.tfstate' }}
  TF_STATE_REGION: ${{ vars.TF_STATE_REGION || vars.AWS_REGION || 'us-east-1' }}
  TF_LOCK_TABLE: ${{ vars.TF_LOCK_TABLE }}

jobs:
  deploy:
    name: Deploy no EKS
    runs-on: ubuntu-latest
    environment: aws

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar credenciais AWS via OIDC
        if: ${{ inputs.deployment_mode == 'aws' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_TO_ASSUME || secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configurar credenciais AWS Academy
        if: ${{ inputs.deployment_mode == 'aws-academy' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validar modo de autenticação AWS
        run: |
          CALLER_ARN="$(aws sts get-caller-identity --query Arn --output text)"
          echo "AWS caller: ${CALLER_ARN}"

          if [[ "${CALLER_ARN}" == *":assumed-role/voclabs/"* && "${{ inputs.deployment_mode }}" != "aws-academy" ]]; then
            echo "Credenciais do AWS Academy Lab detectadas. Execute este workflow com deployment_mode=aws-academy." >&2
            exit 1
          fi

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Configurar kubectl
        uses: azure/setup-kubectl@v4

      - name: Preparar backend remoto do Terraform
        working-directory: infra/aws
        run: |
          if [ -n "${TF_BACKEND_CONFIG}" ]; then
            printf '%s\n' "${TF_BACKEND_CONFIG}" > backend.hcl
          else
            if [ -z "${TF_STATE_BUCKET}" ] || [ -z "${TF_LOCK_TABLE}" ]; then
              echo "Configure o secret TF_BACKEND_CONFIG ou as variables TF_STATE_BUCKET e TF_LOCK_TABLE." >&2
              exit 1
            fi

            cat > backend.hcl <<EOF
          bucket         = "${TF_STATE_BUCKET}"
          key            = "${TF_STATE_KEY}"
          region         = "${TF_STATE_REGION}"
          dynamodb_table = "${TF_LOCK_TABLE}"
          encrypt        = true
          EOF
          fi

          {
            echo "TF_BACKEND_BUCKET=$(grep -E '^\s*bucket\s*=' backend.hcl | sed -E 's/^[^"]*"([^"]*)".*/\1/')"
            echo "TF_BACKEND_REGION=$(grep -E '^\s*region\s*=' backend.hcl | sed -E 's/^[^"]*"([^"]*)".*/\1/')"
            echo "TF_BACKEND_TABLE=$(grep -E '^\s*dynamodb_table\s*=' backend.hcl | sed -E 's/^[^"]*"([^"]*)".*/\1/')"
          } >> "${GITHUB_ENV}"

      - name: Garantir bucket S3 e tabela DynamoDB do backend remoto
        run: |
          BUCKET="${TF_BACKEND_BUCKET}"
          REGION="${TF_BACKEND_REGION}"
          TABLE="${TF_BACKEND_TABLE}"

          if aws s3api head-bucket --bucket "${BUCKET}" 2>/dev/null; then
            echo "Bucket ${BUCKET} já existe."
          else
            echo "Bucket ${BUCKET} não existe. Criando..."
            if [ "${REGION}" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "${BUCKET}" --region "${REGION}"
            else
              aws s3api create-bucket --bucket "${BUCKET}" --region "${REGION}" \
                --create-bucket-configuration LocationConstraint="${REGION}"
            fi

            aws s3api put-bucket-versioning --bucket "${BUCKET}" \
              --versioning-configuration Status=Enabled

            aws s3api put-bucket-encryption --bucket "${BUCKET}" \
              --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'

            aws s3api put-public-access-block --bucket "${BUCKET}" \
              --public-access-block-configuration BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true

            aws s3api put-bucket-ownership-controls --bucket "${BUCKET}" \
              --ownership-controls '{"Rules":[{"ObjectOwnership":"BucketOwnerEnforced"}]}'
          fi

          if aws dynamodb describe-table --table-name "${TABLE}" --region "${REGION}" >/dev/null 2>&1; then
            echo "Tabela DynamoDB ${TABLE} já existe."
          else
            echo "Tabela DynamoDB ${TABLE} não existe. Criando..."
            aws dynamodb create-table \
              --table-name "${TABLE}" \
              --region "${REGION}" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --sse-specification Enabled=true \
              --tags Key=Project,Value=oficina-mecanica-fiap Key=ManagedBy,Value=github-actions

            aws dynamodb wait table-exists --table-name "${TABLE}" --region "${REGION}"

            aws dynamodb update-continuous-backups \
              --table-name "${TABLE}" \
              --region "${REGION}" \
              --point-in-time-recovery-specification PointInTimeRecoveryEnabled=true
          fi

      - name: Preparar variáveis sensíveis do Terraform
        working-directory: infra/aws
        env:
          DEPLOYMENT_MODE: ${{ inputs.deployment_mode }}
          ADMIN_PASSWORD_SECRET: ${{ secrets.ADMIN_PASSWORD }}
          JWT_SECRET_KEY_SECRET: ${{ secrets.JWT_SECRET_KEY }}
          SMTP_PASSWORD_SECRET: ${{ secrets.SMTP_PASSWORD }}
          EKS_ADMIN_PRINCIPAL_ARN: ${{ vars.EKS_ADMIN_PRINCIPAL_ARN }}
          EKS_CLUSTER_ROLE_ARN: ${{ vars.EKS_CLUSTER_ROLE_ARN }}
          EKS_NODE_ROLE_ARN: ${{ vars.EKS_NODE_ROLE_ARN }}
          RDS_ENGINE_VERSION: ${{ vars.RDS_ENGINE_VERSION || '16.14' }}
          RDS_MAX_ALLOCATED_STORAGE: ${{ vars.RDS_MAX_ALLOCATED_STORAGE || '20' }}
          NODE_DESIRED_SIZE: ${{ vars.NODE_DESIRED_SIZE || '1' }}
          NODE_MIN_SIZE: ${{ vars.NODE_MIN_SIZE || '1' }}
          NODE_MAX_SIZE: ${{ vars.NODE_MAX_SIZE || '2' }}
          NODE_DISK_SIZE: ${{ vars.NODE_DISK_SIZE || '20' }}
        run: |
          python - <<'PY'
          import json
          import os

          values = {}
          if os.environ.get("ADMIN_PASSWORD_SECRET"):
              values["admin_password"] = os.environ["ADMIN_PASSWORD_SECRET"]
          if os.environ.get("JWT_SECRET_KEY_SECRET"):
              values["jwt_secret_key"] = os.environ["JWT_SECRET_KEY_SECRET"]
          if os.environ.get("SMTP_PASSWORD_SECRET"):
              values["smtp_password"] = os.environ["SMTP_PASSWORD_SECRET"]

          if os.environ["DEPLOYMENT_MODE"] == "aws-academy":
              required = [
                  "EKS_ADMIN_PRINCIPAL_ARN",
                  "EKS_CLUSTER_ROLE_ARN",
                  "EKS_NODE_ROLE_ARN",
              ]
              missing = [name for name in required if not os.environ.get(name)]
              if missing:
                  raise SystemExit(f"Configure as GitHub variables obrigatórias para aws-academy: {', '.join(missing)}")

              values.update(
                  {
                      "eks_admin_principal_arn": os.environ["EKS_ADMIN_PRINCIPAL_ARN"],
                      "eks_cluster_role_arn": os.environ["EKS_CLUSTER_ROLE_ARN"],
                      "eks_node_role_arn": os.environ["EKS_NODE_ROLE_ARN"],
                      "enable_irsa_resources": False,
                      "enable_github_actions_oidc": False,
                      "install_aws_load_balancer_controller": False,
                      "install_external_secrets_operator": False,
                      "rds_engine_version": os.environ["RDS_ENGINE_VERSION"],
                      "rds_max_allocated_storage": int(os.environ["RDS_MAX_ALLOCATED_STORAGE"]),
                      "node_desired_size": int(os.environ["NODE_DESIRED_SIZE"]),
                      "node_min_size": int(os.environ["NODE_MIN_SIZE"]),
                      "node_max_size": int(os.environ["NODE_MAX_SIZE"]),
                      "node_disk_size": int(os.environ["NODE_DISK_SIZE"]),
                  }
              )

          with open("terraform.auto.tfvars.json", "w", encoding="utf-8") as file:
              json.dump(values, file)
          PY

      - name: Terraform init
        working-directory: infra/aws
        run: terraform init -backend-config=backend.hcl

      - name: Ajustar módulo EKS para AWS Academy
        if: ${{ inputs.deployment_mode == 'aws-academy' }}
        working-directory: infra/aws
        run: |
          python - <<'PY'
          from pathlib import Path

          module_file = Path(".terraform/modules/eks/main.tf")
          content = module_file.read_text(encoding="utf-8")
          block_start = content.index('data "aws_iam_session_context" "current" {')
          block_end = content.index("\n}", block_start)
          block = content[block_start:block_end]

          old = "count = local.create ? 1 : 0"
          new = "count = local.create && var.enable_cluster_creator_admin_permissions ? 1 : 0"

          if new in block:
              print("Módulo EKS já compatível com AWS Academy.")
          elif old in block:
              patched_block = block.replace(old, new, 1)
              content = content[:block_start] + patched_block + content[block_end:]
              module_file.write_text(content, encoding="utf-8")
              print("Módulo EKS ajustado para evitar iam:GetRole em voclabs.")
          else:
              raise SystemExit("Não foi possível localizar o count esperado em data.aws_iam_session_context.current.")
          PY

      - name: Ajustar módulo EKS para permitir escalar desired_size via Terraform
        working-directory: infra/aws
        run: |
          python - <<'PY'
          from pathlib import Path

          module_file = Path(".terraform/modules/eks/modules/eks-managed-node-group/main.tf")
          content = module_file.read_text(encoding="utf-8")

          # Sem essa remoção, o node group ignora silenciosamente qualquer mudança em
          # node_desired_size após a criação inicial (não há cluster autoscaler neste projeto
          # para disputar esse campo com o Terraform).
          old = "    ignore_changes = [\n      scaling_config[0].desired_size,\n    ]\n"
          new = ""

          if old not in content:
              if "ignore_changes" not in content:
                  print("Módulo EKS já sem o ignore_changes de desired_size.")
              else:
                  raise SystemExit("Não foi possível localizar o ignore_changes esperado no node group do módulo EKS.")
          else:
              module_file.write_text(content.replace(old, new, 1), encoding="utf-8")
              print("ignore_changes de scaling_config[0].desired_size removido do módulo EKS.")
          PY

      - name: Terraform plan
        working-directory: infra/aws
        run: terraform plan -out=tfplan

      - name: Terraform apply manual
        if: ${{ inputs.terraform_apply }}
        working-directory: infra/aws
        run: terraform apply -auto-approve tfplan

      - name: Ler outputs do Terraform
        id: tf
        working-directory: infra/aws
        run: |
          terraform output -json > "${RUNNER_TEMP}/terraform-outputs.json"
          python - <<'PY'
          import json
          import os

          with open(os.environ["RUNNER_TEMP"] + "/terraform-outputs.json", encoding="utf-8") as file:
            outputs = json.load(file)

          keys = [
            "cluster_name",
            "ecr_repository_url",
            "rds_endpoint",
            "app_secret_name",
            "api_secrets_role_arn",
          ]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as github_output:
            for key in keys:
              value = outputs.get(key, {}).get("value")
              github_output.write(f"{key}={value or ''}\n")
          PY

      - name: Login no Amazon ECR
        if: ${{ inputs.build_image }}
        run: |
          ECR_REGISTRY="${{ steps.tf.outputs.ecr_repository_url }}"
          ECR_REGISTRY="${ECR_REGISTRY%/*}"
          aws ecr get-login-password --region "${AWS_REGION}" \
            | docker login --username AWS --password-stdin "${ECR_REGISTRY}"

      - name: Build e push da imagem
        if: ${{ inputs.build_image }}
        run: |
          IMAGE="${{ steps.tf.outputs.ecr_repository_url }}:${{ inputs.image_tag }}"
          docker build -t oficina-mecanica-fiap:${{ inputs.image_tag }} .
          docker tag oficina-mecanica-fiap:${{ inputs.image_tag }} "${IMAGE}"
          docker push "${IMAGE}"

      - name: Configurar kubeconfig do EKS
        run: |
          aws eks update-kubeconfig \
            --region "${AWS_REGION}" \
            --name "${{ steps.tf.outputs.cluster_name }}"

      - name: Preparar overlay AWS completo
        if: ${{ inputs.deployment_mode == 'aws' }}
        run: |
          PUBLIC_BASE_URL="${{ inputs.public_base_url }}"
          if [ -z "${PUBLIC_BASE_URL}" ]; then
            PUBLIC_BASE_URL="${{ vars.PUBLIC_BASE_URL }}"
          fi
          if [ -z "${PUBLIC_BASE_URL}" ]; then
            echo "Configure o input public_base_url ou a variable PUBLIC_BASE_URL." >&2
            exit 1
          fi

          sed -i \
            -e "s|REPLACE_WITH_RDS_ENDPOINT|${{ steps.tf.outputs.rds_endpoint }}|g" \
            -e "s|https://REPLACE_WITH_PUBLIC_API_HOST|${PUBLIC_BASE_URL}|g" \
            k8s/overlays/aws/patch-configmap-rds.yaml

          sed -i \
            -e "s|REPLACE_WITH_AWS_REGION|${AWS_REGION}|g" \
            -e "s|REPLACE_WITH_APP_SECRET_NAME|${{ steps.tf.outputs.app_secret_name }}|g" \
            k8s/overlays/aws/external-secret.yaml

          sed -i \
            -e "s|REPLACE_WITH_API_SECRETS_ROLE_ARN|${{ steps.tf.outputs.api_secrets_role_arn }}|g" \
            k8s/overlays/aws/service-account.yaml

          sed -i \
            -e "s|newName: .*|newName: ${{ steps.tf.outputs.ecr_repository_url }}|g" \
            -e "s|newTag: .*|newTag: ${{ inputs.image_tag }}|g" \
            k8s/overlays/aws/kustomization.yaml

      - name: Preparar overlay AWS Academy
        if: ${{ inputs.deployment_mode == 'aws-academy' }}
        run: |
          PUBLIC_BASE_URL="${{ inputs.public_base_url }}"
          if [ -z "${PUBLIC_BASE_URL}" ]; then
            PUBLIC_BASE_URL="http://localhost:8000"
          fi

          sed -i \
            -e "s|REPLACE_WITH_RDS_ENDPOINT|${{ steps.tf.outputs.rds_endpoint }}|g" \
            -e "s|http://localhost:8000|${PUBLIC_BASE_URL}|g" \
            k8s/overlays/aws-academy/patch-configmap-rds.yaml

          sed -i \
            -e "s|newName: .*|newName: ${{ steps.tf.outputs.ecr_repository_url }}|g" \
            -e "s|newTag: .*|newTag: ${{ inputs.image_tag }}|g" \
            k8s/overlays/aws-academy/kustomization.yaml

      - name: Criar Secret Kubernetes no AWS Academy
        if: ${{ inputs.deployment_mode == 'aws-academy' }}
        run: |
          kubectl apply -f k8s/base/namespace.yaml
          aws secretsmanager get-secret-value \
            --secret-id "${{ steps.tf.outputs.app_secret_name }}" \
            --query SecretString \
            --output text > "${RUNNER_TEMP}/oficina-app-secret.json"

          kubectl create secret generic oficina-mecanica-secret \
            -n oficina-mecanica \
            --from-literal=ADMIN_PASSWORD="$(jq -r .ADMIN_PASSWORD "${RUNNER_TEMP}/oficina-app-secret.json")" \
            --from-literal=JWT_SECRET_KEY="$(jq -r .JWT_SECRET_KEY "${RUNNER_TEMP}/oficina-app-secret.json")" \
            --from-literal=POSTGRES_PASSWORD="$(jq -r .POSTGRES_PASSWORD "${RUNNER_TEMP}/oficina-app-secret.json")" \
            --from-literal=SMTP_PASSWORD="$(jq -r .SMTP_PASSWORD "${RUNNER_TEMP}/oficina-app-secret.json")" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Validar overlay Kubernetes
        run: kubectl kustomize "k8s/overlays/${{ inputs.deployment_mode }}" >/tmp/oficina-mecanica-aws.yaml

      - name: Aplicar manifests no EKS
        run: |
          kubectl delete job oficina-mecanica-migrations -n oficina-mecanica --ignore-not-found
          kubectl apply -k "k8s/overlays/${{ inputs.deployment_mode }}"

      - name: Aguardar migrations
        run: |
          kubectl wait \
            --for=condition=complete \
            --timeout="${{ inputs.wait_timeout }}" \
            job/oficina-mecanica-migrations \
            -n oficina-mecanica

      - name: Aguardar rollout da API
        run: |
          kubectl rollout status \
            deployment/oficina-mecanica-api \
            -n oficina-mecanica \
            --timeout="${{ inputs.wait_timeout }}"

      - name: Ajustar PUBLIC_BASE_URL para LoadBalancer do AWS Academy
        if: ${{ inputs.deployment_mode == 'aws-academy' && inputs.public_base_url == '' }}
        run: |
          for attempt in $(seq 1 60); do
            API_HOST="$(kubectl get svc oficina-mecanica-api -n oficina-mecanica -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')"
            if [ -n "${API_HOST}" ]; then
              break
            fi
            sleep 10
          done

          if [ -z "${API_HOST}" ]; then
            echo "LoadBalancer ainda não recebeu hostname externo." >&2
            exit 1
          fi

          kubectl patch configmap oficina-mecanica-config \
            -n oficina-mecanica \
            --type merge \
            -p "{\"data\":{\"PUBLIC_BASE_URL\":\"http://${API_HOST}:8000\"}}"

          kubectl rollout restart deployment/oficina-mecanica-api -n oficina-mecanica
          kubectl rollout status deployment/oficina-mecanica-api -n oficina-mecanica --timeout="${{ inputs.wait_timeout }}"

      - name: Resumo do deploy
        run: |
          echo "Cluster: ${{ steps.tf.outputs.cluster_name }}"
          echo "Imagem: ${{ steps.tf.outputs.ecr_repository_url }}:${{ inputs.image_tag }}"
          kubectl get job oficina-mecanica-migrations -n oficina-mecanica
          kubectl get deployment oficina-mecanica-api -n oficina-mecanica
          kubectl get svc oficina-mecanica-api -n oficina-mecanica
          kubectl get hpa oficina-mecanica-api -n oficina-mecanica
          if [ "${{ inputs.deployment_mode }}" = "aws" ]; then
            kubectl get ingress -n oficina-mecanica
          fi