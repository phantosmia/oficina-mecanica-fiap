services:
  api:
    build:
      context: .
    container_name: oficina-mecanica-api
    environment:
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: Admin@123
      JWT_SECRET_KEY: change-me-in-production
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      DATABASE_PATH: /app/data/oficina_mecanica.db
      # Notificações por e-mail (desabilitadas por padrão)
      # Para habilitar, defina SMTP_ENABLED=true e preencha as demais variáveis
      SMTP_ENABLED: "false"
      SMTP_HOST: ""
      SMTP_PORT: "587"
      SMTP_FROM: ""
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    restart: unless-stopped