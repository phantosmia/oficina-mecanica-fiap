services:
  db:
    image: postgres:16-alpine
    container_name: oficina-mecanica-db
    environment:
      POSTGRES_USER: oficina
      POSTGRES_PASSWORD: oficina
      POSTGRES_DB: oficina_mecanica
    ports:
      - "5432:5432"
    volumes:
      - oficina-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oficina -d oficina_mecanica"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: .
    container_name: oficina-mecanica-api
    environment:
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: Admin@123
      JWT_SECRET_KEY: change-me-in-production
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      PUBLIC_BASE_URL: http://localhost:8000
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: oficina
      POSTGRES_PASSWORD: oficina
      POSTGRES_DB: oficina_mecanica
      # Notificações por e-mail (desabilitadas por padrão)
      # Para habilitar, defina SMTP_ENABLED=true e preencha as demais variáveis
      SMTP_ENABLED: "false"
      SMTP_HOST: ""
      SMTP_PORT: "587"
      SMTP_FROM: ""
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  oficina-pgdata:
