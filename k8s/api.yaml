apiVersion: v1
kind: Service
metadata:
  name: oficina-mecanica-api
  namespace: oficina-mecanica
  labels:
    app.kubernetes.io/name: oficina-mecanica-api
    app.kubernetes.io/part-of: oficina-mecanica
spec:
  type: NodePort
  ports:
    - name: http
      port: 8000
      targetPort: http
      nodePort: 30080
  selector:
    app.kubernetes.io/name: oficina-mecanica-api
    app.kubernetes.io/part-of: oficina-mecanica
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-mecanica-api
  namespace: oficina-mecanica
  labels:
    app.kubernetes.io/name: oficina-mecanica-api
    app.kubernetes.io/part-of: oficina-mecanica
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: oficina-mecanica-api
      app.kubernetes.io/part-of: oficina-mecanica
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oficina-mecanica-api
        app.kubernetes.io/part-of: oficina-mecanica
    spec:
      containers:
        - name: api
          image: oficina-mecanica-fiap:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: oficina-mecanica-config
            - secretRef:
                name: oficina-mecanica-secret
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
