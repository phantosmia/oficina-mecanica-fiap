apiVersion: batch/v1
kind: Job
metadata:
  name: oficina-mecanica-migrations
  namespace: oficina-mecanica
  labels:
    app.kubernetes.io/name: oficina-mecanica-migrations
    app.kubernetes.io/part-of: oficina-mecanica
spec:
  backoffLimit: 4
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oficina-mecanica-migrations
        app.kubernetes.io/part-of: oficina-mecanica
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrations
          image: oficina-mecanica-fiap:latest
          imagePullPolicy: Always
          command:
            - poetry
            - run
            - alembic
            - upgrade
            - head
          envFrom:
            - configMapRef:
                name: oficina-mecanica-config
            - secretRef:
                name: oficina-mecanica-secret
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL