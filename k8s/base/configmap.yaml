apiVersion: v1
kind: ConfigMap
metadata:
  name: oficina-mecanica-config
  namespace: oficina-mecanica
data:
  ACCESS_TOKEN_EXPIRE_MINUTES: "60"
  ADMIN_USERNAME: admin
  JWT_ALGORITHM: HS256
  PUBLIC_BASE_URL: http://localhost:8000
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USER: oficina
  POSTGRES_DB: oficina_mecanica
  RUN_MIGRATIONS_ON_START: "false"
  SMTP_ENABLED: "false"
  SMTP_HOST: ""
  SMTP_PORT: "587"
  SMTP_FROM: ""
  SMTP_USERNAME: ""
  # ADR-0007: nome com que a aplicação aparece no APM do New Relic. Não é
  # segredo — só ativa de fato quando NEW_RELIC_LICENSE_KEY (secret) também
  # estiver definida (ver docker-entrypoint.sh).
  NEW_RELIC_APP_NAME: oficina-mecanica-api
  # Saga (Fase 4, RFC-0007): fila de eventos do orquestrador e filas de
  # comandos dos participantes. Sobrescritas pelo overlay com os outputs do
  # Terraform de cada serviço.
  AWS_REGION: us-east-1
  SAGA_EVENTS_QUEUE_URL: ""
  ESTOQUE_COMMANDS_QUEUE_URL: ""
  EXECUCAO_COMMANDS_QUEUE_URL: ""
  ORCAMENTO_COMMANDS_QUEUE_URL: ""
  PAGAMENTO_COMMANDS_QUEUE_URL: ""
