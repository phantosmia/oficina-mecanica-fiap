# Relay da outbox: envia os comandos da saga às filas dos participantes.
# Uma réplica só, sem HPA: várias réplicas só gerariam envios duplicados.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-mecanica-outbox-relay
  namespace: oficina-mecanica
  labels:
    app.kubernetes.io/name: oficina-mecanica-outbox-relay
    app.kubernetes.io/part-of: oficina-mecanica
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: oficina-mecanica-outbox-relay
      app.kubernetes.io/part-of: oficina-mecanica
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oficina-mecanica-outbox-relay
        app.kubernetes.io/part-of: oficina-mecanica
    spec:
      initContainers:
        - name: wait-for-migrations
          image: oficina-mecanica-fiap:latest
          imagePullPolicy: Always
          command:
            - poetry
            - run
            - python
            - scripts/wait_for_migrations.py
          envFrom:
            - configMapRef:
                name: oficina-mecanica-config
            - secretRef:
                name: oficina-mecanica-secret
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      containers:
        - name: relay
          image: oficina-mecanica-fiap:latest
          imagePullPolicy: Always
          args: ["relay"]
          envFrom:
            - configMapRef:
                name: oficina-mecanica-config
            - secretRef:
                name: oficina-mecanica-secret
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              cpu: 300m
              memory: 384Mi
