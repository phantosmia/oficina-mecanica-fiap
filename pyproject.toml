[tool.poetry]
name = "oficina-mecanica-fiap"
version = "0.1.0"
description = "Projeto da Oficina Mecânica criado para o curso de Pós Graduação de Software Architecture solicitado pela FIAP para conclusão do curso"
authors = []
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.12"
uvicorn = { version = "^0.34.2", extras = ["standard"] }

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"